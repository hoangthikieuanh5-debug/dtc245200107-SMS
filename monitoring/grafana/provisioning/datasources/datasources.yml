# ============================================================
# Grafana Datasource Provisioning
# Auto-load Prometheus và Loki datasources
# ============================================================

apiVersion: 1

datasources:

  # ---- Prometheus ----
  - name: Prometheus
    type: prometheus
    uid: prometheus-uid
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: '15s'
    editable: true

  # ---- Loki ----
  - name: Loki
    type: loki
    uid: loki-uid
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceName: Prometheus
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: '$${__value.raw}'
    editable: true
