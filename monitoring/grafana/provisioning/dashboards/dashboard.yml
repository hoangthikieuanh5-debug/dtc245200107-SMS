# ============================================================
# Grafana Dashboard Provisioning
# ============================================================

apiVersion: 1

providers:
  - name: 'Student Management Dashboards'
    orgId: 1
    folder: 'SMS'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
